plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def vcode = Integer.parseInt((project.findProperty('vc') ?: Long.toString(System.currentTimeMillis().intdiv(60000L))).toString())

android {
    namespace 'io.encodal.idm'
    compileSdk 34

    defaultConfig {
        applicationId 'io.encodal.idm'
        minSdk 29
        targetSdk 34
        // minutes since 1970: always higher than any older build, so Android never sees a "downgrade"
        versionCode vcode
        versionName '0.7.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one (no "package conflict").
    signingConfigs {
        shared {
            storeFile file('idm.keystore')
            storeType 'pkcs12'
            storePassword 'idmencodal'
            keyAlias 'idm'
            keyPassword 'idmencodal'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    // Classic APK layout (compressed libraries and dex): every phone's installer accepts it,
    // including makers' own installers that reject the "stored, page-aligned" layout.
    packaging {
        jniLibs { useLegacyPackaging = true }
        dex { useLegacyPackaging = true }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packagingOptions { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// libVLC: the VLC engine inside my own player, so every format (mkv, HEVC, AC3, DTS, flv, avi, ts…) plays here
dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}

// The same download engine as the Windows app (yt-dlp), running inside the Android app.
chaquopy {
    defaultConfig {
        version = "3.11" // 3.11 still ships 32-bit ARM, so phones with a 32-bit system can install it
        pip {
            install "yt-dlp"
        }
    }
}

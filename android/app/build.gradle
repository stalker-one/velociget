plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.encodal.idm'
    compileSdk 34

    defaultConfig {
        applicationId 'io.encodal.idm'
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty('vc') ?: '1').toString())
        versionName '0.3.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one (no "package conflict").
    signingConfigs {
        shared {
            storeFile file('idm.keystore')
            storeType 'pkcs12'
            storePassword 'idmencodal'
            keyAlias 'idm'
            keyPassword 'idmencodal'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The same download engine as the Windows app (yt-dlp), running inside the Android app.
chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "yt-dlp"
        }
    }
}

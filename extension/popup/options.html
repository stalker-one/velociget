<!doctype html>
<html><head><meta charset="utf-8"><title>IDM By Encodal options</title>
<style>body{font:14px system-ui,"Segoe UI",sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#e6e9ef;background:#17191f}
input{width:100%;padding:8px;border-radius:6px;border:1px solid #323744;background:#1f222a;color:inherit;font:inherit;box-sizing:border-box}
button{margin-top:10px;padding:8px 16px;border-radius:6px;border:0;background:#3b82f6;color:#fff;font:inherit;cursor:pointer}
#msg{margin-top:12px}.ok{color:#34d399}.bad{color:#f87171}code{background:#262a33;padding:1px 5px;border-radius:4px}</style></head>
<body>
<h2>IDM By Encodal pairing</h2>
<p>In the IDM By Encodal app open <b>Options → Browser integration</b>, copy the pairing code and paste it here. This is done once; it lets only this browser talk to the app.</p>
<input id="code" placeholder="24680:0123abcd…" spellcheck="false" autocomplete="off">
<button id="save">Pair</button>
<div id="msg"></div>
<script src="options.js"></script></body></html>

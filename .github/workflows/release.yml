name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run dist
      - run: node scripts/pack-extension.js
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/IDM-By-Encodal-Setup.exe
            dist/idm-by-encodal-extension.zip
          generate_release_notes: true
  android:
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: |
          VC=$(( $(date +%s) / 60 ))
          echo "{\"versionCode\":$VC,\"versionName\":\"$(grep -o "versionName '[^']*'" android/app/build.gradle | cut -d"'" -f2)\"}" > android-version.json
          cat android-version.json
          gradle -p android assembleRelease -Pvc=$VC --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk IDM-By-Encodal.apk
      - name: Check the APK is valid
        run: |
          unzip -tq IDM-By-Encodal.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$AS" verify --verbose --print-certs IDM-By-Encodal.apk | head -12
          unzip -l IDM-By-Encodal.apk | grep -E "lib/.*libpython" | awk '{print $4}' | head -6
          ls -l IDM-By-Encodal.apk && sha256sum IDM-By-Encodal.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            IDM-By-Encodal.apk
            android-version.json

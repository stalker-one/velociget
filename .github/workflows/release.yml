name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run dist
      - run: node scripts/pack-extension.js
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/IDM-By-Encodal-Setup.exe
            dist/idm-by-encodal-extension.zip
          generate_release_notes: true
  android:
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleDebug -Pvc=${{ github.run_number }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk IDM-By-Encodal.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: IDM-By-Encodal.apk
